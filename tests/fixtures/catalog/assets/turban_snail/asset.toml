# large, purpose-built source carrying a main body with one hole cut from
# its own center -- 13px in radius on this asset's own 300x300 canvas,
# sized so its cut file's small_hole finding *passes* at the catalog's
# default 3in reference size (about 0.069in^2, well clear of the 0.02in^2
# threshold) but *needs review* at kelp_forest_mini_pack's own 1in override
