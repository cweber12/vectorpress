# Hand-authored collection metadata (ADR 0005). The collection slug is this
# file's stem. Rule-based membership: every asset whose ecosystems include
# "Kelp forest" (ADR 0008), resolved live against loaded assets by
# domain.collection_resolution.resolve_membership -- also unioned into
# pacific_coast_marine.

name = "Kelp Forest Ecosystem"
description = """
Every asset tagged to the kelp forest ecosystem, gathered automatically as
new matching assets are added to the catalog.
"""
tags = ["kelp forest"]
marketplace_category = "Nature & Wildlife"

[membership.rule]
field = "ecosystems"
values = ["Kelp forest"]
