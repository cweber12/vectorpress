# Hand-authored product metadata (ADR 0005). The product slug is this
# file's stem. Declares an inline collection (same Membership shape as a
# collection file, ADR 0008) instead of referencing a collection slug.
#
# reference_size_in overrides the catalog default (3.0 in) down to 1.0 in
# (§9.1, ADR 0008, issue #38): a mini pack sells at a smaller physical size
# than the catalog default, and `vpress validate --product
# kelp_forest_mini_pack` validates at this size instead.
#
# ineligible_members = "exclude" (§10): the fixture's one committed
# "exclude" product, rather than "refuse" (every other fixture product's
# default) -- it still refuses when its own single rule-matched member is
# not eligible.

derivative_types = ["cut_svg"]
formats = ["svg"]
tier = "mini_pack"
price = 6.00
reference_size_in = 1.0
ineligible_members = "exclude"

[membership.rule]
